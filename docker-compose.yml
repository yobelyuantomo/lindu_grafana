version: '3.8'

# Dipakai supaya ingester bisa ikut satu broker MQTT yang sama dengan stack utama
# (lindu_broker dari docker-compose.yml root), bukan broker terisolasi sendiri.
# Nama network ini dibuat otomatis oleh Docker Compose dari nama folder proyek
# root ("lindu"), jadi stack utama HARUS sudah dijalankan (docker compose up)
# dari folder bernama "lindu" sebelum stack ini dijalankan.
networks:
  lindu_default:
    external: true

services:
  postgres:
    image: postgres:13
    container_name: grafana_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lindu_db
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Ikut network bersama supaya lindu_consensus (yang berjalan di stack root)
    # bisa menjangkau database ini. consensus.py menulis tb_sensor_telemetry,
    # tb_system_alerts, dan tb_ml_predictions ke sini, dan seluruh panel Grafana
    # membacanya dari sini juga (datasource lindu_pg -> postgres:5432).
    # Tanpa ini consensus hidup tetapi tidak pernah bisa menyimpan apa pun.
    networks:
      - default
      - lindu_default

  ingester:
    build:
      context: ./ingester
      dockerfile: Dockerfile
    container_name: grafana_ingester
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # Broker MQTT utama (lindu_broker), bukan broker terisolasi milik stack ini
      MQTT_HOST: lindu_broker
      DB_HOST: postgres
    ports:
      - "5001:5000"
    networks:
      - default
      - lindu_default

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/seismic.json
    depends_on:
      - postgres
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
